{% extends 'base.html' %}{% block content %}
<div class="mb-3">
  <h3>Reports</h3>
  <p class="text-muted">Filter and review support activity.</p>
</div>
<div class="card p-3 mb-3">
  <div class="row g-2">
    <div class="col-md-2">
      <label class="form-label">From</label
      ><input type="date" id="from" class="form-control" />
    </div>
    <div class="col-md-2">
      <label class="form-label">To</label
      ><input type="date" id="to" class="form-control" />
    </div>
    <div class="col-md-2">
      <label class="form-label">Priority</label
      ><select id="priority" class="form-select">
        <option value="">All</option>
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
        <option>Critical</option>
      </select>
    </div>
    <div class="col-md-2">
      <label class="form-label">Status</label
      ><select id="status" class="form-select">
        <option value="">All</option>
        <option>Open</option>
        <option>Assigned</option>
        <option>In Progress</option>
        <option>Waiting for Customer</option>
        <option>Resolved</option>
        <option>Closed</option>
        <option>Reopened</option>
      </select>
    </div>
    <div class="col-md-2">
      <label class="form-label">Category</label
      ><select id="category" class="form-select">
        <option value="">All</option>
      </select>
    </div>
    <div class="col-md-2 d-flex align-items-end">
      <button class="btn btn-primary w-100" onclick="loadReport()">
        Apply
      </button>
    </div>
  </div>
</div>
<div id="reportSummary" class="row g-3 mb-4"></div>
<div class="row g-4">
  <div class="col-lg-6">
    <div class="card p-3 chart-card">
      <h6>By Status</h6>
      <canvas id="rStatus"></canvas>
    </div>
  </div>
  <div class="col-lg-6">
    <div class="card p-3 chart-card">
      <h6>By Priority</h6>
      <canvas id="rPriority"></canvas>
    </div>
  </div>
  <div class="col-lg-6">
    <div class="card p-3 chart-card">
      <h6>By Category</h6>
      <canvas id="rCategory"></canvas>
    </div>
  </div>
  <div class="col-lg-6">
    <div class="card p-3 chart-card">
      <h6>By Technician</h6>
      <canvas id="rTech"></canvas>
    </div>
  </div>
</div>
<div class="card mt-4">
  <div class="table-responsive">
    <table class="table">
      <thead>
        <tr>
          <th>Ticket</th>
          <th>Customer</th>
          <th>Subject</th>
          <th>Technician</th>
          <th>Priority</th>
          <th>Status</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody id="reportRows"></tbody>
    </table>
  </div>
</div>
{% endblock %}{% block scripts %}
<script src="{{ url_for('static',filename='js/reports.js') }}"></script>
{% endblock %}
