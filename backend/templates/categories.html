{% extends 'base.html' %}{% block content %}
<div class="d-flex justify-content-between mb-3">
  <div>
    <h3>Categories</h3>
    <p class="text-muted">Configure support categories.</p>
  </div>
  <button class="btn btn-primary" onclick="categoryModal()">
    + Add Category
  </button>
</div>
<div class="card">
  <div class="table-responsive">
    <table class="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Tickets</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="categoryRows"></tbody>
    </table>
  </div>
</div>
<div class="modal fade" id="catModalEl">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="catForm">
        <div class="modal-header">
          <h5>Category</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="id" /><label class="form-label"
            >Name *</label
          ><input class="form-control mb-2" name="name" required /><label
            class="form-label"
            >Description</label
          ><input class="form-control mb-2" name="description" /><label
            class="form-label"
            >Status</label
          ><select class="form-select" name="status">
            <option>active</option>
            <option>inactive</option>
          </select>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Ticket Details Modal -->
<div class="modal fade" id="ticketModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header border-0">
        <div>
          <h4 class="fw-bold mb-1">Ticket Details</h4>
          <small class="text-secondary">Customer Support Portal</small>
        </div>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label">Ticket Number</label>
            <input id="vTicket" class="form-control" readonly>
          </div>

          <div class="col-md-6">
            <label class="form-label">Technician</label>
            <input id="vTech" class="form-control" readonly>
          </div>

          <div class="col-12">
            <label class="form-label">Subject</label>
            <input id="vSubject" class="form-control" readonly>
          </div>

          <div class="col-12">
            <label class="form-label">Status</label>
            <input id="vStatus" class="form-control" readonly>
          </div>

          <div class="col-12">
            <label class="form-label">Resolution Notes</label>
            <textarea id="vNotes" rows="4" class="form-control" readonly></textarea>
          </div>

        </div>

      </div>

      <div class="modal-footer border-0">
        <button class="btn btn-primary" data-bs-dismiss="modal">
          Close
        </button>
      </div>

    </div>
  </div>
</div>

{% endblock %}{% block scripts %}
<script src="{{ url_for('static',filename='js/categories.js') }}"></script>
{% endblock %}
