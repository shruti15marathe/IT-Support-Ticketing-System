<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IT Support Ticketing</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
<link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>

<body>

<div id="toastArea"></div>

<div class="layout">

    <aside class="sidebar">
        <div class="brand">🛠 IT Support</div>
        <nav id="nav" class="sidebar-nav"></nav>
    </aside>

    <main class="main-content">

        <header class="topbar">

            <div>
                <h4 id="pageTitle" class="mb-0">Customer dashboard</h4>
                <small class="text-secondary">IT Support Ticketing System</small>
            </div>

            <div class="d-flex align-items-center gap-3">

              <div class="notification-wrapper position-relative">

    <button
        id="notificationBtn"
        class="notification-btn"
        type="button">

        🔔

        <span
            id="notifBadge"
            class="badge bg-danger rounded-pill notif-badge">
            0
        </span>

    </button>

    <div
        id="notificationPanel"
        class="notification-panel">

      <div class="notification-header">
    <strong>Notifications</strong>

    <div class="notification-actions">
        <button id="markAllReadBtn" class="icon-btn" title="Mark all read">✓✓</button>

        <button id="clearAllBtn" class="icon-btn" title="Clear all">🗑</button>

        <button id="closeBtn" class="icon-btn" title="Close">✕</button>
    </div>
</div>

        <div id="notificationList">
            <div class="notification-empty">
                No notifications
            </div>
        </div>

    </div>

</div> 

            <span id="userName" class="fw-semibold"></span>

                <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                    Logout
                </button>

            </div>

        </header>

        <section class="page-body">
            {% block content %}{% endblock %}
        </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/notifications.js') }}"></script>

{% block scripts %}{% endblock %}

</body>
</html>
