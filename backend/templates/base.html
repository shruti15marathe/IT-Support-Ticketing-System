<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IT Support Ticketing</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>

<body>

<div id="toastArea"></div>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            🛠 IT Support
        </div>

        <nav id="nav" class="sidebar-nav">
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <header class="topbar">

            <div>
                <h4 id="pageTitle" class="mb-0">Technician Dashboard</h4>
                <small class="text-secondary">IT Support Ticketing System</small>
            </div>

            <div class="d-flex align-items-center gap-3">

                <div class="position-relative">
                    🔔
                    <span id="notifBadge" class="badge bg-danger rounded-pill notif-badge">
                        0
                    </span>
                </div>

                <span id="userName" class="fw-semibold"></span>

                <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                    Logout
                </button>

            </div>

        </header>

        <section class="page-body">
            {% block content %}{% endblock %}
        </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>

{% block scripts %}{% endblock %}

</body>
</html>
