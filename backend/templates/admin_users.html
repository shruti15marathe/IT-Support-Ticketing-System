{% extends 'base.html' %}

{% block content %}
<div class="admin-header">
    <div>
        <span class="eyebrow">ADMIN PORTAL</span>
        <h1>User Management</h1>
        <p>Manage customers, technicians and administrators.</p>
    </div>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">+ Add User</button>
</div>

<div class="admin-panel mb-4">
    <div class="row g-3 align-items-center">
        <div class="col-md-6">
            <input type="text" id="searchUser" class="form-control" placeholder="Search by name or email">
        </div>
        <div class="col-md-3">
            <select id="roleFilter" class="form-select">
                <option value="all">All Roles</option>
                <option value="customer">Customer</option>
                <option value="technician">Technician</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <div class="col-md-3 text-end">
            Total Users: <strong id="totalUsers">0</strong>
        </div>
    </div>
</div>

<div class="admin-panel">
    <div class="panel-title">
        <div>
            <span class="section-label">COMPANY USERS</span>
            <h3>Employee Directory</h3>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table admin-table align-middle">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th width="120">Action</th>
                </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="addUserModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create New User</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <input type="hidden" id="editUserId">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="fullName" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Only for new user">
                </div>

                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select id="role" class="form-select">
                        <option value="customer">Customer</option>
                        <option value="technician">Technician</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select id="status" class="form-select">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button id="saveUserBtn" class="btn btn-primary">Save User</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("pageTitle").innerText="User Management";
</script>
<script src="{{ url_for('static',filename='js/admin_users.js') }}"></script>
{% endblock %}
